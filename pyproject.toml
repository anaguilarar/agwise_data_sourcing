[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agwise-data-sourcing"
version = "0.1.0"
description = "Python toolkit for downloading and processing geospatial datasets (MODIS/VIIRS, SoilGrids, DEM, Climate) via Google Earth Engine for agricultural applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Andres Aguilar", email = "andres.aguilar@cgiar.org" },
]
keywords = [
  "google-earth-engine",
  "geospatial",
  "agriculture",
  "MODIS",
  "SoilGrids",
  "remote-sensing",
  "climate",
  "DEM",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "earthengine-api>=1.0.0",
  "geemap>=0.34.0",
  "geopandas>=1.0.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0,<2.3",
  "xarray>=2024.1.0",
  "rasterio>=1.3.0",
  "rioxarray>=0.15.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  "PyYAML>=6.0",
  "omegaconf>=2.3.0",
  "tqdm>=4.65.0",
  "netCDF4>=1.6.0",
  "shapely>=2.0.0",
  "seaborn>=0.12.0",
  "requests>=2.28.0",
  "pillow>=9.0.0",
  "soilgrids>=0.1.4",
  "rosetta-soil>=0.1.2",
  "zarr>=2.16.0",
  "numba>=0.57.0,<0.62",
  "llvmlite>=0.44.0,<0.45",
]

[project.optional-dependencies]
dssat = [
  "DSSATTools>=2.1.0",
]
notebook = [
  "notebook>=7.0.0",
]
full = [
  "DSSATTools>=2.1.0",
  "notebook>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/anaguilarar/agwise_data_sourcing"
Repository = "https://github.com/anaguilarar/agwise_data_sourcing"
Issues = "https://github.com/anaguilarar/agwise_data_sourcing/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gee_datasets*"]
